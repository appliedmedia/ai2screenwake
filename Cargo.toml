[workspace]
members = [
    "code/crates/ai2screenwake_backend",
    "code/crates/ai2screenwake_client",
    "code/crates/ai2screenwake_native",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

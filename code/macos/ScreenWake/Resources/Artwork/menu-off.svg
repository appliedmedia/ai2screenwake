<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" role="img" aria-labelledby="menu-off-title menu-off-description">
  <title id="menu-off-title">AI2ScreenWake off</title>
  <desc id="menu-off-description">A landscape television with an inset screen, left rabbit ears, closed eyes, a smile and ascending vector Zzz at the upper right. Idle protection is off.</desc>
  <g id="television-frame" fill="none" stroke="#000" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <path id="left-rabbit-ears" d="M2 2L6 7.5L9 1.5M4.5 7.5H7.5"/>
    <rect id="cabinet" x="1" y="7.5" width="22" height="15" rx="2.5"/>
    <rect id="inset-screen" x="3" y="9.5" width="18" height="11" rx="1.6" stroke-width="1.1"/>
    <path id="closed-eyes" d="M5 13Q7.5 15.5 10 13M14 13Q16.5 15.5 19 13"/>
    <path id="smile" d="M9 17.5Q12 20 15 17.5" stroke-width="1.1"/>
  </g>
  <g id="right-sleep-marks" fill="none" stroke="#000" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12.5 5H14.5L12.5 7H14.5"/>
    <path d="M16 3H18.5L16 5.5H18.5"/>
    <path d="M20 1H23L20 4H23"/>
  </g>
</svg>

  <title id="menu-off-title">ScreenWake off</title>
  <desc id="menu-off-description">A smiling antenna television with closed eyes and three rising sleep marks. Idle protection is off.</desc>
  <g id="television-frame" fill="none" stroke="#000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path id="antenna" d="M7 5.25L11 9.5L14 3.75"/>
    <rect id="cabinet" x="1.5" y="9.5" width="21" height="12" rx="3"/>
    <path id="panel-divider" d="M18.25 10V21"/>
    <path id="feet" d="M6 21.5V23M18 21.5V23"/>
    <path id="smile" d="M8 18.25Q10.25 20.25 12.5 18.25" stroke-width="1.25"/>
  </g>
  <g id="control-knobs" fill="#000">
    <circle cx="20.25" cy="13.25" r=".8"/>
    <circle cx="20.25" cy="16.5" r=".8"/>
  </g>

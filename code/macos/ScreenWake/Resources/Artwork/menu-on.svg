<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" role="img" aria-labelledby="menu-on-title menu-on-description">
  <title id="menu-on-title">AI2ScreenWake on</title>
  <desc id="menu-on-description">The same smiling antenna television with very wide-open eyes and no sleep marks. Idle protection is on.</desc>
  <g id="television-frame" fill="none" stroke="#000" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path id="antenna" d="M7 2L12 6L17 2"/>
    <rect id="cabinet" x="1.5" y="6" width="21" height="16" rx="3"/>
    <path id="smile" d="M10 18Q12 20 14 18" stroke-width="1.3"/>
  </g>
  <g id="wide-open-eyes" fill="none" stroke="#000" stroke-width="1.5">
    <ellipse cx="7.5" cy="12.5" rx="3" ry="4"/>
    <ellipse cx="16.5" cy="12.5" rx="3" ry="4"/>
  </g>
  <g id="pupils" fill="#000">
    <circle cx="7.5" cy="12.5" r="1.15"/>
    <circle cx="16.5" cy="12.5" r="1.15"/>
  </g>
</svg>

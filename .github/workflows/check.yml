name: Canonical check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Canonical completed-wave regression
        run: cargo xtask check
      - name: Retain successful and failed check evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: check-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: |
            target/check-evidence/
            target/screenwake/build-evidence/
            target/screenwake/assets-evidence/
# end check.yml
